<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic AES Cipher</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS Library for AES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Google Fonts: MedievalSharp for Gothic look, Vazirmatn for Persian text -->
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // Tailwind configuration for custom gothic colors
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        gothic: ['MedievalSharp', 'Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        gothic: {
                            darkBg: '#0f0a0a',
                            darkCard: '#1a1111',
                            blood: '#8a0303',
                            bloodHover: '#660000',
                            gold: '#d4af37',
                            parchment: '#e8dcc4',
                            lightCard: '#f4ecd8',
                            textDark: '#f0e6d2',
                            textLight: '#2c1e16',
                            borderDark: '#3a0000',
                            borderLight: '#5c3a21'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'MedievalSharp', 'Vazirmatn', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        .gothic-box {
            border: 6px double;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: border-color 0.4s ease, background-color 0.4s ease;
        }
        
        /* Light Mode Borders */
        .gothic-box { border-color: #5c3a21; }
        .gothic-input { border: 2px solid #5c3a21; background-color: #fdfaf3; }
        
        /* Dark Mode Borders */
        .dark .gothic-box { border-color: #8a0303; box-shadow: 0 10px 30px rgba(138, 3, 3, 0.2); }
        .dark .gothic-input { border: 2px solid #8a0303; background-color: #0a0505; color: #d4af37; }

        /* Custom Scrollbar for Textareas */
        textarea::-webkit-scrollbar { width: 10px; }
        textarea::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        textarea::-webkit-scrollbar-thumb { background: #8a0303; border-radius: 5px; }

        /* Fancy Gothic Title */
        .gothic-title {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        .dark .gothic-title { text-shadow: 2px 2px 8px rgba(212, 175, 55, 0.4); }

        /* Toast Message */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
            border: 2px solid #8a0303;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="bg-gothic-parchment text-gothic-textLight dark:bg-gothic-darkBg dark:text-gothic-textDark min-h-screen flex items-center justify-center p-4">

    <!-- Dark Mode Toggle Button -->
    <button onclick="toggleDarkMode()" class="fixed top-4 left-4 p-3 rounded-full bg-gothic-blood text-white hover:bg-gothic-bloodHover transition duration-300 shadow-lg border-2 border-gothic-gold z-50">
        <i id="themeIcon" class="fas fa-moon text-xl w-6 h-6 flex items-center justify-center"></i>
    </button>

    <div class="w-full max-w-3xl gothic-box bg-gothic-lightCard dark:bg-gothic-darkCard rounded-lg p-6 sm:p-10 relative">
        
        <!-- Decorative Corners -->
        <div class="absolute top-2 left-2 text-gothic-blood dark:text-gothic-gold text-2xl"><i class="fas fa-spider"></i></div>
        <div class="absolute top-2 right-2 text-gothic-blood dark:text-gothic-gold text-2xl"><i class="fas fa-spider"></i></div>
        <div class="absolute bottom-2 left-2 text-gothic-blood dark:text-gothic-gold text-2xl"><i class="fas fa-skull"></i></div>
        <div class="absolute bottom-2 right-2 text-gothic-blood dark:text-gothic-gold text-2xl"><i class="fas fa-skull"></i></div>

        <h1 class="text-3xl sm:text-4xl text-center mb-8 font-bold gothic-title text-gothic-blood dark:text-gothic-gold" style="font-family: 'MedievalSharp', cursive;" dir="ltr">
            Crypt of the AES
        </h1>

        <!-- Secret Key Input -->
        <div class="mb-6">
            <label class="block mb-2 font-bold text-lg"><i class="fas fa-key mr-2 text-gothic-blood dark:text-gothic-gold"></i> کلید رازآلود (Password)</label>
            <input type="password" id="secretKey" placeholder="برای قفل کردن یا باز کردن، کلید را اینجا بنویسید..." 
                   class="w-full p-3 rounded gothic-input focus:outline-none focus:ring-2 focus:ring-gothic-blood transition" dir="rtl">
            <p class="text-xs mt-1 opacity-75">بدون این کلید، هیچ جادویی کار نخواهد کرد.</p>
        </div>

        <!-- Field 1: Plain Text -->
        <div class="mb-4">
            <div class="flex justify-between items-end mb-2">
                <label class="font-bold text-lg"><i class="fas fa-scroll mr-2 text-gothic-blood dark:text-gothic-gold"></i> متن اصلی (Plain Text)</label>
                <button onclick="copyText('plainText')" class="text-sm bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1 rounded transition border border-gray-400 dark:border-gray-600">
                    <i class="fas fa-copy"></i> کپی
                </button>
            </div>
            <textarea id="plainText" rows="4" placeholder="متن خود را برای رمزنگاری اینجا وارد کنید..." 
                      class="w-full p-3 rounded gothic-input focus:outline-none focus:ring-2 focus:ring-gothic-blood transition resize-none"></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-center gap-4 my-6">
            <button onclick="encryptText()" class="flex-1 bg-gothic-blood hover:bg-gothic-bloodHover text-white font-bold py-3 px-4 rounded transition border-2 border-transparent dark:border-gothic-gold shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-lock"></i> طلسم کن (Encrypt) <i class="fas fa-arrow-down"></i>
            </button>
            <button onclick="decryptText()" class="flex-1 bg-gray-800 hover:bg-black text-white dark:bg-gray-700 dark:hover:bg-gray-600 font-bold py-3 px-4 rounded transition border-2 border-gothic-borderLight dark:border-gothic-borderDark shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-lock-open"></i> باطل کن (Decrypt) <i class="fas fa-arrow-up"></i>
            </button>
        </div>

        <!-- Field 2: Cipher Text -->
        <div class="mt-4">
            <div class="flex justify-between items-end mb-2">
                <label class="font-bold text-lg"><i class="fas fa-book-dead mr-2 text-gothic-blood dark:text-gothic-gold"></i> متن طلسم‌شده (Cipher Text)</label>
                <button onclick="copyText('cipherText')" class="text-sm bg-gothic-blood text-white hover:bg-gothic-bloodHover px-3 py-1 rounded transition shadow border border-transparent dark:border-gothic-gold">
                    <i class="fas fa-copy"></i> کپی
                </button>
            </div>
            <textarea id="cipherText" rows="4" placeholder="متن رمزنگاری شده را برای رمزگشایی اینجا وارد کنید..." 
                      class="w-full p-3 rounded gothic-input focus:outline-none focus:ring-2 focus:ring-gothic-blood transition resize-none font-mono text-sm" dir="ltr"></textarea>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast">پیام</div>

    <script>
        // Check local storage for theme preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Dark Mode Toggle Logic
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        }

        // Show Toast Function
        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.backgroundColor = isError ? "#8a0303" : "#2c1e16";
            toast.style.color = isError ? "#fff" : "#d4af37";
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // Encrypt Logic (AES)
        function encryptText() {
            const key = document.getElementById('secretKey').value;
            const plainText = document.getElementById('plainText').value;

            if (!key) {
                showToast("خطا: برای طلسم کردن به کلید رازآلود نیاز است!", true);
                return;
            }
            if (!plainText) {
                showToast("خطا: متنی برای طلسم کردن وجود ندارد!", true);
                return;
            }

            try {
                const cipherText = CryptoJS.AES.encrypt(plainText, key).toString();
                document.getElementById('cipherText').value = cipherText;
                showToast("متن با موفقیت طلسم شد!");
            } catch (error) {
                showToast("خطا در عملیات طلسم کردن!", true);
            }
        }

        // Decrypt Logic (AES)
        function decryptText() {
            const key = document.getElementById('secretKey').value;
            const cipherText = document.getElementById('cipherText').value;

            if (!key) {
                showToast("خطا: برای باطل کردن طلسم به کلید رازآلود نیاز است!", true);
                return;
            }
            if (!cipherText) {
                showToast("خطا: متنی برای باطل کردن وجود ندارد!", true);
                return;
            }

            try {
                const bytes = CryptoJS.AES.decrypt(cipherText, key);
                const originalText = bytes.toString(CryptoJS.enc.Utf8);

                if (!originalText) {
                    throw new Error("Invalid Key or Corrupted Text");
                }

                document.getElementById('plainText').value = originalText;
                showToast("طلسم با موفقیت باطل شد!");
            } catch (error) {
                showToast("خطا: کلید اشتباه است یا متن نامعتبر است!", true);
            }
        }

        // Copy to Clipboard
        function copyText(elementId) {
            const textarea = document.getElementById(elementId);
            if (!textarea.value) {
                showToast("متنی برای کپی کردن وجود ندارد!", true);
                return;
            }
            
            // Fallback for older browsers or iframes
            textarea.select();
            textarea.setSelectionRange(0, 99999); /* For mobile devices */
            
            try {
                document.execCommand('copy');
                showToast("متن با موفقیت کپی شد!");
            } catch (err) {
                showToast("خطا در کپی کردن متن!", true);
            }
            
            // Deselect
            window.getSelection().removeAllRanges();
        }
    </script>
</body>
</html>
